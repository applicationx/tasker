[tools]
rust = { version = "stable", components = "rustfmt,clippy" }

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run Clippy"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run all tests"
run = "cargo test --all"

[tasks.check]
description = "Run all validation"
depends = ["fmt", "clippy", "test"]
run = "cargo check --all-targets --all-features"

[tasks.coverage]
description = "Run tests and enforce at least 85% line coverage"
run = "cargo llvm-cov --all-features --workspace --locked --fail-under-lines 85 --summary-only"

[tasks.build]
description = "Build release binary"
run = "cargo build --release --locked"

[tasks.install]
description = "Install tasker locally"
run = "cargo install --path . --locked --force"
